
<!doctype html>
<html>

<body>

    <script>
        let a = Number(prompt("Enter first number:"));
        let b = Number(prompt("Enter second number:"));
        let c = Number(prompt("Enter third number:"));

        let largest;

        if (a >= b && a >= c) {
            largest = a;
        } 
        else if (b >= a && b >= c) {
            largest = b;
        } 
        else {
            largest = c;
        }

        document.write("Largest number is: " + largest);
    </script>

</body>

</html>
